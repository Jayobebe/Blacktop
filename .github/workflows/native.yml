# Builds the Android and iOS apps from the store build (the app's own files bundled in, no crypto payments).
#
#   Android: a debug APK anyone can install on a phone, every time, also published at a fixed address
#            (the android-test release) for the hidden download on the welcome screen. With the signing secrets set, also the
#            signed release bundle (.aab) for Google Play.
#   iOS:     compiles the app for the simulator, unsigned: the proof that it builds, with no Mac to hand.
#            Run by hand with "Upload to TestFlight" ticked, it also signs the app and uploads it to
#            App Store Connect (TestFlight), with the Apple secrets below (see ios-setup.md).
#   Versions: the version is What's new's newest (scripts/app-version.mjs); the build number is the run number.
#
# Runs when the app or the native projects change, and by hand from the Actions tab (Run workflow).
# The files are under the run's Artifacts.
#
# Secrets for the signed Android bundle (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   the .jks file, base64 (certutil -encode on Windows, base64 -w0 on Linux)
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Optional, for push notifications in the app:
#   GOOGLE_SERVICES_JSON      the contents of Firebase's google-services.json
# For TestFlight (an App Store Connect API key with the Admin role, Users and Access → Integrations):
#   APPLE_TEAM_ID             the team id (Membership details)
#   ASC_KEY_ID, ASC_ISSUER_ID the key's id and the issuer id shown above the keys
#   ASC_KEY_P8_BASE64         the downloaded AuthKey_….p8, base64
name: Native apps

on:
  workflow_dispatch:
    inputs:
      testflight:
        description: "Also sign the iOS app and upload it to TestFlight"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      # The app's own files are bundled into the apps, so a change to the web app is a new build too.
      - "src/**"
      - "public/**"
      - "index.html"
      - "vite.config.ts"
      - "android/**"
      - "ios/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - "scripts/cap-sync-store.mjs"
      - "scripts/check-store-build.mjs"
      - "scripts/fix-ios-spm.mjs"
      - "scripts/app-version.mjs"
      - ".github/workflows/native.yml"

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write   # publishes the test app as a release file
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      # Every upload to Google Play needs a higher number than the last.
      BT_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Version
        run: echo "BT_VERSION_NAME=$(node scripts/app-version.mjs)" >> "$GITHUB_ENV"
      - name: Push notifications (only with Firebase's file)
        if: env.GOOGLE_SERVICES_JSON != ''
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          echo "VITE_NATIVE_PUSH=1" >> "$GITHUB_ENV"
      - name: Store build of the web app, checked, then into the native projects
        run: npm run cap:sync:store
      - name: Debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: blacktop-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      # The same address every time: holding Recover on the welcome screen downloads it (WelcomeScreen, TEST_APK).
      - name: Publish the test app
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk blacktop-test.apk
          gh release view android-test >/dev/null 2>&1 || gh release create android-test --prerelease --latest=false \
            --title "Android test build" \
            --notes "The newest test build of the Android app, replaced on every build. Not the Play Store version."
          gh release upload android-test blacktop-test.apk --clobber
      - name: Signing key
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/blacktop-release.jks
          {
            echo "storeFile=blacktop-release.jks"
            echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } > android/keystore.properties
      - name: Signed release bundle for Google Play
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        with:
          name: blacktop-android-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  ios:
    name: iOS (compiles, unsigned)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Store build of the web app, checked, then into the native projects
        run: npm run cap:sync:store
      - name: Which Xcode, and what the project has
        run: |
          xcodebuild -version
          xcodebuild -list -project ios/App/App.xcodeproj
      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)|\*\* " || true
          grep -q "BUILD SUCCEEDED" xcodebuild.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blacktop-ios-build-log
          path: xcodebuild.log

  # Signed and uploaded to App Store Connect, only when asked (Run workflow → "Upload to TestFlight").
  # Signing is automatic through the API key (-allowProvisioningUpdates): Xcode makes the certificate and
  # profile itself, so none are stored here. The app record must exist in App Store Connect first.
  ios-testflight:
    name: iOS (TestFlight)
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      # Registering for push needs the entitlement this build is signed with; Apple's own push service, no Firebase.
      VITE_NATIVE_PUSH: "1"
    steps:
      - name: The Apple secrets are set
        run: |
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v isn't set (see the top of this file)"; exit 1; fi
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Store build of the web app, checked, then into the native projects
        run: npm run cap:sync:store
      - name: API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey.p8" >> "$GITHUB_ENV"
          echo "BT_VERSION_NAME=$(node scripts/app-version.mjs)" >> "$GITHUB_ENV"
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Blacktop.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$BT_VERSION_NAME" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            | tee archive.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)|\*\* " || true
          grep -q "ARCHIVE SUCCEEDED" archive.log
      - name: Upload to App Store Connect
        run: |
          set -o pipefail
          cp ios/ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Blacktop.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tee export.log | grep -E "error:|EXPORT (SUCCEEDED|FAILED)|Upload|\*\* " || true
          grep -q "EXPORT SUCCEEDED" export.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blacktop-ios-testflight-log
          path: |
            archive.log
            export.log
