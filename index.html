      <main style="font-family: sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; color: #eee; background: #0a0a0a;">
        <h1>Welcome to Blacktop — every road, your way</h1>
        <p>Blacktop is a free ride companion for motorcycles, cars, bicycles, e-bikes and e-scooters. Track your rides, ride together with live convoys and voice chat, and get help if you crash. No sign-up, no ads.</p>
        <h2>What Blacktop does</h2>
        <ul>
          <li><strong>Set up for how you ride:</strong> motorcycles, cars, bicycles, e-bikes and e-scooters; tell Blacktop what you ride, who with and what you care about, and it hides everything else.</li>
          <li><strong>Ride tracking and stats:</strong> distance, time, speed, lean angle and G-force, with ride history, saveable receipts, 3D flyovers, corner reports, recap cards and Burn trips.</li>
          <li><strong>Live convoys:</strong> share a code or QR, see everyone on the map in real time, lobby chat, shared destination and waypoints, and a status bar with rider count, average speed, ETA and a regroup prompt.</li>
          <li><strong>Nearby Riders:</strong> handshake with riders close by to share a convoy, map and voice; merge and split convoys.</li>
          <li><strong>In-ride voice chat:</strong> encrypted, works with Bluetooth headsets and intercoms, never stored on a server.</li>
          <li><strong>Pillion Mode:</strong> passengers join on their own phone for voice, reactions and rescue alerts.</li>
          <li><strong>Crash rescue:</strong> optional crash detection that checks you're okay, then alerts your convoy, crew and Discord with your location; every rider gets a route to you.</li>
          <li><strong>Blacktop Map:</strong> search, multi-stop routes, twisty routes, loop routes, rain radar and drier routes, speed cameras, offline map packs.</li>
          <li><strong>Turn-by-turn directions:</strong> on-map guidance with optional spoken directions.</li>
          <li><strong>Track Pack:</strong> track-day lap timing with sector lines, a pit crew link with live timing, lap comparison and CSV/GPX export.</li>
          <li><strong>Garage:</strong> vehicles, photos, mileage and service reminders.</li>
          <li><strong>Logbook and Vehicle Passport:</strong> each vehicle's ride and service history, handed over to the next keeper.</li>
          <li><strong>Blacktop World:</strong> opt-in crews, leaderboards, weekly challenges, arcade games and Blacktank crew fuel fund.</li>
          <li><strong>Badges, trading cards and Ghost Cards:</strong> earn badges, collect cards, hunt card drops on the map and race time attacks.</li>
          <li><strong>Notifications:</strong> rescue calls, heavy weather, service reminders and crew updates.</li>
          <li><strong>Blacktop Radio:</strong> stations from your own music.</li>
          <li><strong>Pay Up:</strong> Nimiq Pay (NIM and USDT) QR payments and tips.</li>
          <li><strong>Private by default:</strong> ride history stays on your phone, live convoy data is deleted when a ride ends, and the Burn button wipes everything.</li>
        </ul>
        <p>This app needs JavaScript — open <a href="https://blacktoplive.com">blacktoplive.com</a> in a modern browser or install it to your home screen.</p>
