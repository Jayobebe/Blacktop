      <main style="font-family: sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; color: #eee; background: #0a0a0a;">
        <h1>Blacktop — GPS convoy riding, finally connected</h1>
        <p>Blacktop is a free, privacy-first motorcycle group ride app. No account required — anonymous sign-in, data stays local, and a burn button wipes everything.</p>
        <h2>Everything Blacktop does</h2>
        <ul>
          <li><strong>Convoys:</strong> live GPS tracking for groups up to 8 riders, with a lobby, text chat, QR-code invites and leadership transfer.</li>
          <li><strong>Voice:</strong> in-ride peer-to-peer voice chat with mute/disconnect and headset routing.</li>
          <li><strong>Solo rides:</strong> the same full logging and stats when riding alone.</li>
          <li><strong>Ride stats:</strong> distance, time, average/top speed, lean angle and G-force, with history, summaries, 3D flyover recaps, corner scoring and badges.</li>
          <li><strong>Rescue:</strong> automatic crash detection that pings your convoy leader (and optionally Discord) with your coordinates.</li>
          <li><strong>Blacktop Map:</strong> place search, waypoints, routes, speed cameras, weather radar and offline map packs.</li>
          <li><strong>Blacktop World:</strong> a globe of live riders, crews, leaderboards, weekly challenges — and Blacktank, a shared crew fuel fund with pledge ledger and unanimous withdrawal votes.</li>
          <li><strong>Card drops:</strong> trading cards dropped on the map to collect, trade, challenge for and earn kickbacks from.</li>
          <li><strong>Pay Up:</strong> tips and payments via Nimiq Pay (NIM and USDT), QR codes — also runs as a Nimiq mini-app.</li>
          <li><strong>Garage:</strong> your bikes, maintenance reminders, photos and the Mecha-Nick assistant.</li>
          <li><strong>Radio:</strong> play your own local audio files with a GTA-style station wheel and media controls.</li>
          <li><strong>Arcade:</strong> Hit Heavy, Petrol Head and Derez Legacy lightcycle games.</li>
        </ul>
        <p>This app needs JavaScript — open <a href="https://blacktoplive.com">blacktoplive.com</a> in a modern browser or install it to your home screen.</p>
