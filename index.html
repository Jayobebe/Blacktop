        <h1>Blacktop: every road, your way</h1>
        <p>Blacktop is a free ride companion for motorcycles, cars, bicycles, e-bikes and e-scooters. Track your rides, ride out together with live convoys and intercom voice chat, and get help if you crash. No account, no ads, 18 languages.</p>
        <h2>What Blacktop does</h2>
        <ul>
          <li><strong>Set up around you:</strong> tell Blacktop what you ride, who you ride with and what you care about, and it hides everything else.</li>
          <li><strong>Ride tracking:</strong> live speed, distance, time, lean angle and a G-force circle, with a mini map on the ride screen.</li>
          <li><strong>After the ride:</strong> a receipt, an automatic name, badges, a corner report, a 3D flyover and an overlay video for your action camera.</li>
          <li><strong>Live convoys:</strong> share a code or QR, see everyone on the map on the same route, waypoints and a regroup call.</li>
          <li><strong>Voice chat:</strong> up to 8 riders over Bluetooth intercoms and headsets.</li>
          <li><strong>Passengers and spectators:</strong> a pillion screen of their own, and friends watching the convoy live.</li>
          <li><strong>Crash rescue:</strong> optional crash detection that asks if you're okay, then alerts your convoy, crew, Discord and riders nearby with your location.</li>
          <li><strong>Anti-theft alarm:</strong> motion detection, a pattern lock and a siren for a parked vehicle.</li>
          <li><strong>Blacktop Map:</strong> search, quick stops with opening hours and prices, twisty routes and loop routes, route preferences, rain radar and drier routes, speed cameras, hazard reports, offline maps.</li>
          <li><strong>Turn-by-turn:</strong> spoken directions in a plain voice or a pilot's radio voice, rally pace notes and ETA sharing.</li>
          <li><strong>Track Day:</strong> real circuits, lap and sector timing, a pit crew on a friend's phone and records on real circuits.</li>
          <li><strong>Garage:</strong> vehicles, service reminders and a logbook that hands over to the next keeper.</li>
          <li><strong>Blacktop World:</strong> opt-in crews, boards, challenges and an arcade with SwitchBack card battles.</li>
          <li><strong>Private by design:</strong> rides stay on your phone, convoy data is wiped when a ride ends, and Burn deletes everything.</li>
        </ul>
        <p>Blacktop needs JavaScript: open <a href="https://blacktoplive.com">blacktoplive.com</a> in a modern browser or install it to your home screen. A plain-text guide is at <a href="https://blacktoplive.com/llms.txt">blacktoplive.com/llms.txt</a>.</p>
