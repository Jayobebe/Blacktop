    <noscript>
      <main style="font-family: sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; color: #eee; background: #0a0a0a;">
        <h1>Welcome to Blacktop — every road, your way</h1>
        <p>Blacktop is a free ride companion for motorcycles, cars, bicycles, e-bikes and e-scooters. Track your rides, ride together with live convoys and voice chat, and get help if you crash. No sign-up, no ads.</p>
        <h2>What Blacktop does</h2>
        <ul>
          <li><strong>Set up for how you ride:</strong> tell Blacktop what you ride, who with and what you care about, and it hides everything else.</li>
          <li><strong>Ride tracking and stats:</strong> distance, time, speed, lean angle and G-force, with ride history, saveable receipts, 3D flyovers, corner reports and recap cards.</li>
          <li><strong>Live convoys:</strong> share a code or QR, see everyone on the map in real time, lobby chat, shared destination and waypoints.</li>
          <li><strong>In-ride voice chat:</strong> encrypted, works with Bluetooth headsets and intercoms, never stored on a server.</li>
          <li><strong>Crash rescue:</strong> optional crash detection that checks you're okay and alerts your convoy leader or Discord with your location.</li>
          <li><strong>Blacktop Map:</strong> search, waypoints, loop routes, rain radar and drier routes, speed cameras, offline map packs.</li>
          <li><strong>Garage:</strong> vehicles, photos, mileage and service reminders.</li>
          <li><strong>Blacktop World:</strong> opt-in crews, leaderboards, weekly challenges, arcade games and Blacktank crew fuel fund.</li>
          <li><strong>Badges and trading cards:</strong> earn badges, collect cards and hunt card drops on the map.</li>
          <li><strong>Blacktop Radio:</strong> stations from your own music.</li>
          <li><strong>Pay Up:</strong> Nimiq Pay (NIM and USDT) QR payments and tips.</li>
          <li><strong>Private by default:</strong> ride history stays on your phone, live convoy data is deleted when a ride ends, and the Burn button wipes everything.</li>
        </ul>
        <p>This app needs JavaScript — open <a href="https://blacktoplive.com">blacktoplive.com</a> in a modern browser or install it to your home screen.</p>
      </main>
    </noscript>
